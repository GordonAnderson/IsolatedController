; =============================================================================
;  IsolatedControllerR1.0 — PlatformIO project configuration
; =============================================================================
;
;  Hardware: GAA Custom Electronics IsolatedControllerR1.0
;    - MCU:   Adafruit ItsyBitsy M4 Express (ATSAMD51G19A, 120 MHz Cortex-M4)
;    - Role:  MIPS bus module (I2C client on EXT1/EXT2) that also bridges to
;             a separate, galvanically isolated full MIPS controller over
;             RS232 + 2 trigger lines, via 4x AFBR-395025RZ fiber isolators.
;    - Onboard: 2x AD5593R (I2C ADC/DAC/GPIO), PCA9540 I2C mux, PCA9517D
;               I2C buffer.
;
;  See NOTES.md for the confirmed pin table (pulled directly from the
;  .kicad_pcb pad pinfunction properties) and open hardware questions.

[platformio]
default_envs = isolatedcontroller

[env:isolatedcontroller]
platform  = atmelsam
board     = adafruit_itsybitsy_m4
framework = arduino

; Board defaults (explicit for clarity / easy override later)
board_build.mcu   = samd51g19a
board_build.f_cpu = 120000000L

; ---------------------------------------------------------------------------
; Library dependencies
; ---------------------------------------------------------------------------
;  GAACE_Core     — commandProcessor, ringBuffer, charAllocate, debug, Button,
;                   Devices (AD5593R driver lives here), WireHelper, Errors.
;  ArduinoThread  — cooperative scheduler (Thread / ThreadController), used
;                   for the 25 ms periodic Update() in IsolatedController.cpp.
;  FlashStorage   — internal-flash persistence for the Data struct (cmaglie's
;                   library; FlashAsEEPROM.h ships in the same repo).
;
;  NOTE: UseSPIflash is OFF for this milestone (see IsolatedController.cpp).
;  GAACE_Core's library.json excludes src/FlashFS from its own build by
;  default (it needs Adafruit_SPIFlash + SdFat - Adafruit Fork, and the repo
;  README says consuming projects must re-add it via their own
;  lib_extra_dirs/build_src_filter). We don't need calibration data to
;  survive firmware re-uploads yet for the DCbias milestone, so we're
;  skipping that dependency-resolution question entirely for now rather
;  than guess at the right override syntax. Internal-flash persistence
;  (SAVE/RESTORE via FlashStorage) still works without it. Revisit once
;  calibration persistence is actually needed.
lib_ldf_mode = deep+
lib_deps =
    https://github.com/GordonAnderson/GAACE_Core.git
    https://github.com/GordonAnderson/ArduinoThread.git
    cmaglie/FlashStorage

monitor_speed = 115200
monitor_eol   = LF

; Native USB CDC on SAMD — upload via the UF2/SAM-BA bootloader (double-tap
; reset, or the BLOAD command once firmware is running).
upload_protocol = sam-ba
